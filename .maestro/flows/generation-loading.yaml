appId: des.c5inco.pokedexer.debug
name: Load Pokémon from generations I through V
tags:
  - regression
---
- launchApp:
    clearState: true
- assertVisible: "Pokédex"
- tapOn: "Pokédex"
- assertVisible: "Pokemon"
