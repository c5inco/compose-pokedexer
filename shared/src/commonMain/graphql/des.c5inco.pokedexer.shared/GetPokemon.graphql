query PokemonOriginal($generationId: Int!, $versionGroupId: Int!) {
  info: pokemonspecies_aggregate(where: {generation_id: {_eq: $generationId}}) {
    total: aggregate {
    count
    }
  }
  pokemon: pokemonspecies(where: {generation_id: {_eq: $generationId}}, order_by: {id: asc}) {
    id
    name
    description: pokemonspeciesflavortexts(where: {language_id: { _eq: 9}}, order_by: {version_id: asc}, limit: 1) {
      flavorText: flavor_text
    }
    detail: pokemons {
      types: pokemontypes {
        type: type {
          name
        }
      }
      stats: pokemonstats {
        stat: stat {
          id
          name
        }
        baseStat: base_stat
      }
      height
      weight
      moves: pokemonmoves(where: {move_learn_method_id: {_eq: 1}, version_group_id: {_eq: $versionGroupId}}, order_by: {level: asc}) {
        level
        id: move_id
      }
      abilities: pokemonabilities {
        id: ability_id
        isHidden: is_hidden
      }
    }
    genderRate: gender_rate
    evolutionChain: evolutionchain {
      evolutions: pokemonspecies(order_by: {id: asc_nulls_first}) {
        id
        targetLevels: pokemonevolutions {
          level: min_level
          triggerType: evolution_trigger_id
          itemId: evolution_item_id
        }
      }
    }
    species: pokemonspeciesnames(where: {language: {iso639: {_eq: "en"}}}) {
      genus
    }
    generation_id
  }
}
