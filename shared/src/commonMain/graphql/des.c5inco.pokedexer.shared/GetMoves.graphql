query PokemonOriginalMoves {
  info: move_aggregate(where: {move_damage_class_id: {_is_null: false}, pp: {_is_null: false}, type_id: {_is_null: false}}) {
    total: aggregate {
      count
    }
  }
  moves: move(where: {move_damage_class_id: {_is_null: false}, pp: {_is_null: false}, type_id: {_is_null: false}}) {
    id
    name
    accuracy
    category: movedamageclass {
      name
    }
    description: moveflavortexts(where: {language: {iso639: {_eq: "en"}}}, order_by: {version_group_id: desc}, limit: 1) {
      flavorText: flavor_text
    }
    pp
    power
    type: type {
      name
    }
  }
}
